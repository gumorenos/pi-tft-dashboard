# Journal en disco (en DietPi /var/log es tmpfs y los logs se pierden al reiniciar).
# Se instala en /etc/systemd/journald.conf.d/50-persistente.conf; el journal se guarda en
# /var/lib/journal-disk, montado sobre /var/log/journal (ver install.sh --journal).
# Pocas escrituras para cuidar la SD: se vuelca a disco cada 5 min (los errores, al instante).
[Journal]
Storage=persistent
SystemMaxUse=40M
SystemKeepFree=500M
SyncIntervalSec=5min
MaxFileSec=1week
